version: "v0.4"
project:
  name: Projective Space
  description: >-
    Projective spectra of graded rings, polynomial standard charts and covers,
    homogeneous ideals, coordinate points, graded transport, geometric-cover
    global-sections morphisms, positive-degree-scaled Proj maps on their
    natural open domains with full ordinary point-prime contraction and
    arbitrary-element membership, whole-arrow unit-scaling invariance and
    geometric properties.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0
sources:
  - title: Original projective-space formal development
    authors:
      - Formal Frontier Agents
    type: original-proof
    relationship: independently-proves
    note: >-
      Original project mathematical development and subsequent native adaptations;
      this bibliographic entry does not claim coverage of any selected external source.
  - title: The Lean mathematical library (mathlib4)
    authors:
      - The mathlib community
    id: https://github.com/leanprover-community/mathlib4
    type: software
    relationship: background
    note: >-
      Imported projective-spectrum, graded-ring and polynomial infrastructure;
      the geometric-cover global-sections, unit-scaling and degree-scaled-map
      modules adapt gluing and chart proof text by Andrew Yang (2024), copyright
      2024, Apache-2.0, from Mathlib.AlgebraicGeometry.ProjectiveSpectrum.Basic,
      with file-level credit and a corresponding NOTICE. The degree-scaled-map
      module also retains the 2022 Jujian Zhang homogeneous-localization credit.
  - title: Graded Rings
    type: software
    relationship: background
    note: >-
      Direct graded-quotient, symmetric-algebra and degree-multiplying
      homogeneous-localization dependency at the reviewed official release.
  - title: Scheme Properties
    type: software
    relationship: background
    note: Direct factoriality and normality dependency.
automation:
  methods:
    - method: agent
      framework: Codex CLI and Hive Tasks
      tool_setup: AI-assisted source and Lean development with maintainer coordination and independent bounded reviews.
  notes: >-
    AI agents prepared original and adapted code, documentation and source assembly;
    this metadata describes involvement, not automated proof certification.
status:
  scope: >-
    26-leaf projective-space library with aggregate public import,
    seven direct/root clients, and official pinned private dependencies. Its
    39-file, four-target graph at accepted code revision
    8712cd1d042032ba4577145b3a3034ed2609e671 passed its own native
    run 647 (3495 build jobs) and complete transitive standard-axiom audit
    of 780 origins, including 302 private-prefix names, with only propext,
    Classical.choice and Quot.sound. Independent affected-destination review
    4399 and Atlas's code acceptance and protected integration followed on
    September 28, 2026. These are code facts, not point-prime release or
    source-coverage decisions. The
    historical 33-file, four-target graph at
    c74a33c74b7d9bde054a284ada6d28bac7bd2f7d passed its full build and
    private-inclusive transitive standard-axiom audit on September 27, 2026.
    Its documentation successor 7eab8f1f08cbc12e63520f189efbc3d3ea1841bf
    was published as official release 18b517099fddac61a86f7c20d591178db9825b9a;
    the later 35-file accepted baseline was separately published with the same
    tree as its accepted main. This open-domain transfer was prepared from
    frozen incubator input separately accepted on September 27, 2026. Exact
    destination code revision d866ec190766ef2a76978fadc05627717f300468
    passed native run 632 on all four targets and 37 files (3493 build jobs),
    with 770 audited origins including 294 private names and only the three
    standard axioms. Independent promotion review 4376 and Atlas's code
    acceptance and integration apply to that revision. The producer's
    corresponding official release ad60036d9745d4f0bca2f398538cff4377c93603
    is verified and shares its tree with the accepted baseline. The added
    point-prime leaf, client and changed root have their own review and native
    evidence at the accepted code revision above; none of the historical
    33/35/37-file checks by itself certifies that graph. Documentary successors
    with unchanged Lean/build/dependency/checker inputs may reuse run 647;
    subsequent release review, acceptance and publication are separate.
    Source correspondence and coverage are separate.
