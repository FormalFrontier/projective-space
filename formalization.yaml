    Earlier specialist reviews and source/notice acceptances retain their exact
    scopes. The earlier UnitScaling transfer has a distinct accepted and
    published baseline. The positive-degree-scaled Proj mathematics was
    independently reviewed in its isolated incubator contribution; the frozen
    official-Graded-import input was subsequently accepted in the incubator on
    September 27, 2026. Neither that
    review nor earlier destination build evidence alone certified the new graph.
