version: "v0.4"
project:
  name: Projective Space
  description: >-
    Projective spectra of graded rings, polynomial standard charts and covers,
    homogeneous ideals, coordinate points, graded transport, geometric-cover
    global-sections morphisms and geometric properties.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0
sources:
  - title: Original projective-space formal development
    authors:
      - Formal Frontier Agents
    type: original-proof
    relationship: independently-proves
    note: >-
      Original project mathematical development and subsequent native adaptations;
      this bibliographic entry does not claim coverage of any selected external source.
  - title: The Lean mathematical library (mathlib4)
    authors:
      - The mathlib community
    id: https://github.com/leanprover-community/mathlib4
    type: software
    relationship: background
    note: >-
      Imported projective-spectrum, graded-ring and polynomial infrastructure;
      the geometric-cover global-sections module also adapts gluing and chart
      proof text by Andrew Yang (2024), copyright 2024, Apache-2.0, from
      Mathlib.AlgebraicGeometry.ProjectiveSpectrum.Basic, with file-level credit.
  - title: Graded Rings
    type: software
    relationship: background
    note: Direct graded-quotient and symmetric-algebra dependency.
  - title: Scheme Properties
    type: software
    relationship: background
    note: Direct factoriality and normality dependency.
automation:
  methods:
    - method: agent
      framework: Codex CLI and Hive Tasks
      tool_setup: AI-assisted source and Lean development with maintainer coordination and independent bounded reviews.
  notes: >-
    AI agents prepared original and adapted code, documentation and source assembly;
    this metadata describes involvement, not automated proof certification.
status:
  scope: >-
    23-leaf projective-space library with aggregate public import and
    official pinned private dependencies. The 33-file, four-target graph at
    c74a33c74b7d9bde054a284ada6d28bac7bd2f7d passed its full build and
    private-inclusive transitive standard-axiom audit on September 27, 2026.
    Exact release acceptance and verified publication are separate decisions.
review:
  status: mathematical and API inputs independently reviewed; release disposition is revision-specific
  notes: >-
    Independent destination review and maintainer code acceptance were recorded
    for the geometric-cover contribution at c74a33c74b7d9bde054a284ada6d28bac7bd2f7d.
    Earlier specialist reviews and source/notice acceptances retain their exact
    scopes. Documentation-only successors may reuse unchanged mathematical and
    build evidence but require review of their changes. The maintainer's dated
    release record identifies the exact consolidated independent assessment,
    build and complete transitive axiom evidence, rights disposition, acceptance
    and publication; none is inferred from this metadata alone.
    Library release does not certify source coverage.
